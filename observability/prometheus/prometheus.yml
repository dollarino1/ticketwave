# Prometheus PULLS metrics: every scrape_interval it fetches /metrics from each target
# and stores the numbers with a timestamp. Services never push, so a service that dies
# simply stops answering, which Prometheus records as up == 0. That is how "is it
# alive" is answered without the service having to report its own death.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # One job per service so every series carries job="<service>". The ports are the
  # METRICS_ADDR defaults; they exist only on the compose network, never on the host.
  - job_name: gateway
    static_configs: [{ targets: ["gateway:9107"] }]
  - job_name: auth
    static_configs: [{ targets: ["auth:9101"] }]
  - job_name: inventory
    static_configs: [{ targets: ["inventory:9102"] }]
  - job_name: payment
    static_configs: [{ targets: ["payment:9103"] }]
  - job_name: order
    static_configs: [{ targets: ["order:9104"] }]
  - job_name: notification
    static_configs: [{ targets: ["notification:9105"] }]
  - job_name: analytics
    static_configs: [{ targets: ["analytics:9106"] }]
  - job_name: realtime
    static_configs: [{ targets: ["realtime:9108"] }]
