services:
  postgres:
    image: postgres:17-alpine
    container_name: ticketwave-postgres
    environment:
      POSTGRES_USER: ticketwave
      POSTGRES_PASSWORD: ticketwave
      POSTGRES_DB: auth
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketwave"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: