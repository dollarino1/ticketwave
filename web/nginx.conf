# Each open seat-map stream holds a connection and a goroutine on realtime-svc, so
# one address may hold only a few. Without this, a single client could open
# thousands and starve everyone else. Shared by every location that uses it.
limit_conn_zone $binary_remote_addr zone=streams_per_ip:10m;

server {
    listen 8080;
    root /usr/share/nginx/html;

    # Security headers. CSP says the page may load code and styles only from its own
    # origin, so an injected <script src="https://evil"> or inline script is refused
    # by the browser even if the HTML were somehow tampered with.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Live seat updates (Server-Sent Events). These go to realtime-svc, not the
    # gateway. A regex location outranks the /api/ prefix below, so this wins for
    # exactly /api/events/<id>/stream. A stream is one long response, so nginx must
    # not buffer it (the client would see nothing until the buffer filled) and must
    # not time it out while it is quiet.
    location ~ ^/api/events/[^/]+/stream$ {
        proxy_pass http://realtime:8082;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;

        limit_conn streams_per_ip 20;
        limit_conn_status 429;
    }

    # The API. Browser and API share one origin, so there is no CORS at all, and the
    # SameSite=Strict refresh cookie is sent along without any special handling.
    location /api/ {
        proxy_pass http://gateway:8081;
        proxy_http_version 1.1;

        # The gateway rate-limits by client address, and trusts this header only when
        # started with TRUST_PROXY_HEADERS=true. nginx OVERWRITES any value the client
        # sent, so a client cannot pick its own address and dodge the limits.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        # One ID per request, generated here, appears in nginx's and the gateway's
        # logs, so a single request can be followed across both.
        proxy_set_header X-Request-ID $request_id;

        proxy_read_timeout 15s;
        proxy_connect_timeout 3s;
    }

    # Built assets have content hashes in their names, so a changed file always has a
    # new name and the old one can be cached for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Any other path is a client-side route (/events/123): serve the app and let the
    # router decide. index.html must never be cached, or users keep an old build that
    # points at asset files which no longer exist.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
